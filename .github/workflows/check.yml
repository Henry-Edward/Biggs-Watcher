name: Biggs used gear watcher

on:
  schedule:
    - cron: "*/10 * * * *"   # ADJUST INTERVAL HERE (e.g. "*/15 * * * *" = every 15 min)
  workflow_dispatch:
    inputs:
      test:
        description: "Send a sample email of the 3 newest items"
        type: boolean
        default: false

concurrency:
  group: biggs-watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check for new listings
        run: python check.py ${{ inputs.test && '--test' || '' }}
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Save state
        run: |
          if [[ -n "$(git status --porcelain seen.json)" ]]; then
            git config user.name "gear-watcher"
            git config user.email "gear-watcher@users.noreply.github.com"
            git add seen.json
            git commit -m "update seen listings"
            git push
          fi
